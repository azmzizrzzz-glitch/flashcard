<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>لغت‌نامه</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f2ea;--card:#fffdf8;--ink:#1d2421;--mute:#6b746f;--line:#e4ddd0;
  --acc:#1f6f5c;--acc-ink:#fff;--acc-soft:#dcebe5;--bad:#b4492f;--bad-soft:#f6e1da;--ok-soft:#dcebe5;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(40,50,45,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121819;--card:#1b2325;--ink:#e8ece9;--mute:#8e9a95;--line:#2a3437;
    --acc:#4fb596;--acc-ink:#0d1f1a;--acc-soft:#1f3a33;--bad:#e0846a;--bad-soft:#3a2520;--ok-soft:#1f3a33;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Vazirmatn","Vazir","Segoe UI",system-ui,-apple-system,"Noto Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;
  font-size:16px;line-height:1.7;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:max(18px,env(safe-area-inset-top)) 0 6px;display:flex;align-items:baseline;justify-content:space-between}
header h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:-.01em}
header .sub{color:var(--mute);font-size:.85rem}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;
  background:var(--acc);color:var(--acc-ink);font-weight:600;width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:40px;width:auto;padding:0 14px;font-size:.9rem}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.soft{background:var(--acc-soft);color:var(--acc)}
.btn:active{transform:scale(.98)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.stats{display:flex;gap:10px;margin:12px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:1.6rem;line-height:1.2}
.stat span{color:var(--mute);font-size:.82rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chip{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--acc-soft);color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);min-height:320px;padding:28px 22px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;margin:14px 0;cursor:pointer}
.card .word{font-size:2.4rem;font-weight:700;line-height:1.2;letter-spacing:-.01em;direction:ltr;cursor:pointer}
.card .ipa{color:var(--mute);direction:ltr;font-size:1rem}
.card .fa-big{font-size:1.9rem;font-weight:700;line-height:1.5}
.card .hint{color:var(--mute);font-size:.85rem;margin-top:14px}
.card hr{width:60%;border:0;border-top:1px solid var(--line);margin:10px 0}
.card .fa{font-size:1.35rem;font-weight:600}
.card .en{color:var(--mute);direction:ltr}
.card .ex{direction:ltr;font-style:italic;margin-top:6px}
.card .exfa{color:var(--mute);font-size:.95rem}
.card .rel{color:var(--mute);font-size:.82rem;direction:ltr}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-size:1.2rem;display:inline-flex;align-items:center;justify-content:center}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grades button{min-height:64px;border-radius:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3}
.grades small{font-weight:400;opacity:.8;font-size:.76rem}
.g-again{background:var(--bad-soft);color:var(--bad)}
.g-good{background:var(--acc);color:var(--acc-ink)}
.g-easy{background:var(--acc-soft);color:var(--acc)}
.progress{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0}
.progress i{display:block;height:100%;background:var(--acc);transition:width .25s}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .w{font-weight:700;direction:ltr;min-width:96px;text-align:left}
.row .m{flex:1;color:var(--mute);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:.74rem;padding:2px 9px;border-radius:99px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.badge.due{background:var(--bad-soft);color:var(--bad)}
input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;min-height:46px}
textarea{min-height:120px;direction:ltr;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
label.f{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-size:.76rem;min-height:62px}
nav button span{font-size:1.25rem;line-height:1}
nav button.on{color:var(--acc);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .card{min-height:0;cursor:default;margin-top:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:20;font-size:.9rem;max-width:90vw}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.empty .big{font-size:2.6rem}
details{margin:10px 0}summary{cursor:pointer;color:var(--acc);font-weight:600}
pre{direction:ltr;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;font-size:.78rem}
.muted{color:var(--mute);font-size:.88rem}
h2{font-size:1.05rem;margin:18px 0 6px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>لغت‌نامه</h1><span class="sub" id="sub"></span></header>
  <main id="view"></main>
</div>
<nav><div class="in" id="nav"></div></nav>
<input type="file" id="file" accept=".json,application/json,text/plain" hidden>
<div id="modal"></div>
<div id="toast"></div>

<script>
"use strict";
/* ---------- تنظیمات ---------- */
// فاصله‌ی مرورها (روز). مرحله‌ی ۰ = همان امروز (لغت تازه وارد شده)
const STAGES = [0, 1, 3, 7, 14, 30, 60];

/* ---------- ابزارهای کوچک ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => fmt(new Date());
const addDays = (s, n) => { const [y,m,d] = s.split("-").map(Number); return fmt(new Date(y, m-1, d+n)); };
const daysBetween = (a, b) => Math.round((new Date(b+"T00:00") - new Date(a+"T00:00")) / 864e5);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function toast(msg){
  const t = $("#toast"); t.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.innerHTML = "", 2600);
}

/* ---------- پایگاه داده (IndexedDB) ---------- */
let db; const words = new Map();
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open("vocab", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("words", {keyPath: "id"});
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const store = mode => db.transaction("words", mode).objectStore("words");
const loadAll = () => new Promise(res => { const q = store("readonly").getAll(); q.onsuccess = () => res(q.result); });
const put = w => { words.set(w.id, w); return new Promise(res => { const r = store("readwrite").put(w); r.onsuccess = res; r.onerror = res; }); };
const live = () => [...words.values()].filter(w => !w.deleted);

/* ---------- منطق مرور ---------- */
const dueList = () => { const t = today(); return live().filter(w => w.due <= t).sort((a,b) => a.due.localeCompare(b.due) || a.stage - b.stage); };
const stageLabel = s => `روز ${STAGES[s]}`;
const whenText = n => n === 0 ? "همین الان" : n === 1 ? "فردا" : `${n} روز بعد`;

async function grade(w, g){
  if (g === "again") { w.stage = 0; w.due = today(); }
  else { w.stage = Math.min(w.stage + (g === "easy" ? 2 : 1), STAGES.length - 1); w.due = addDays(today(), STAGES[w.stage]); }
  w.updatedAt = Date.now();
  await put(w);
}

/* ---------- تلفظ ---------- */
function speak(text){
  if (!("speechSynthesis" in window)) return toast("این مرورگر تلفظ را پشتیبانی نمی‌کند");
  const synth = window.speechSynthesis; synth.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = .9;
  const v = synth.getVoices().find(v => v.lang.replace("_","-").toLowerCase() === "en-us") || synth.getVoices().find(v => v.lang.toLowerCase().startsWith("en"));
  if (v) u.voice = v; else if (synth.getVoices().length) toast("صدای انگلیسی روی این دستگاه نصب نیست");
  synth.speak(u);
}

/* ---------- نمایش کارت ---------- */
const spk = t => `<button class="icon-btn" data-act="speak" data-text="${esc(t)}" aria-label="تلفظ">🔊</button>`;
function frontHTML(w, dir){
  if (dir === "fa") return `<div class="fa-big" dir="rtl">${esc(w.fa)}</div>`;
  return `<div class="word" data-act="speak" data-text="${esc(w.word)}">${esc(w.word)}</div>
          <div class="ipa">${esc(w.ipa)}${w.pos ? " · " + esc(w.pos) : ""}</div>${spk(w.word)}`;
}
function detailsHTML(w){
  return `${w.en ? `<div class="en">${esc(w.en)}</div>` : ""}
    ${w.example ? `<div class="ex">${esc(w.example)}</div>` : ""}
    ${w.exampleFa ? `<div class="exfa">${esc(w.exampleFa)}</div>` : ""}
    ${w.related ? `<div class="rel">${esc(w.related)}</div>` : ""}`;
}
function backHTML(w, dir){
  if (dir === "fa") return `<div class="word" data-act="speak" data-text="${esc(w.word)}">${esc(w.word)}</div>
      <div class="ipa">${esc(w.ipa)}${w.pos ? " · " + esc(w.pos) : ""}</div>${spk(w.word)}<hr>${detailsHTML(w)}`;
  return `<div class="fa">${esc(w.fa)}</div><hr>${detailsHTML(w)}`;
}
function fullCardHTML(w){
  return `<div class="card" data-nofocus>
    <div class="word" data-act="speak" data-text="${esc(w.word)}">${esc(w.word)}</div>
    <div class="ipa">${esc(w.ipa)}${w.pos ? " · " + esc(w.pos) : ""}</div>${spk(w.word)}
    <div class="fa">${esc(w.fa)}</div><hr>${detailsHTML(w)}</div>`;
}

/* ---------- وضعیت صفحه ---------- */
let tab = "today";
let session = null;               // مرور امروز
let test = {stage: "all", dir: "en", mode: "shuffle", list: null, i: 0, shown: false};

const TABS = [["today","📅","امروز"],["all","📚","همه لغت‌ها"],["test","🎯","تست"],["data","💾","داده‌ها"]];
function renderNav(){
  $("#nav").innerHTML = TABS.map(([k,ic,l]) => `<button data-act="tab" data-tab="${k}" class="${tab===k?"on":""}"><span>${ic}</span>${l}</button>`).join("");
}
function render(){
  renderNav();
  const dueN = dueList().length;
  $("#sub").textContent = live().length ? `${live().length} لغت · ${dueN} برای امروز` : "";
  $("#view").innerHTML = ({today: viewToday, all: viewAll, test: viewTest, data: viewData})[tab]();
  if (tab === "all") renderList();
  window.scrollTo(0, 0);
}

/* --- امروز --- */
function stageChips(){
  const c = STAGES.map(() => 0); live().forEach(w => c[w.stage]++);
  return `<div class="chips">${c.map((n,i) => n ? `<span class="chip">${stageLabel(i)}: ${n}</span>` : "").join("")}</div>`;
}
function viewToday(){
  const all = live();
  if (!all.length) return `<div class="empty"><div class="big">🌱</div><p>هنوز لغتی نداری.<br>از بخش «داده‌ها» فایل لغت‌ها را وارد کن.</p>
    <button class="btn" data-act="tab" data-tab="data">رفتن به داده‌ها</button></div>`;
  if (session) return viewSession();
  const due = dueList(), t = today();
  const upcoming = all.filter(w => w.due > t).sort((a,b) => a.due.localeCompare(b.due))[0];
  return `<div class="stats">
      <div class="stat"><b>${due.length}</b><span>برای مرور امروز</span></div>
      <div class="stat"><b>${all.filter(w => w.stage === 0).length}</b><span>لغت جدید (روز 0)</span></div>
      <div class="stat"><b>${all.length}</b><span>کل لغت‌ها</span></div></div>
    ${due.length
      ? `<button class="btn" data-act="start">شروع مرور (${due.length} کارت)</button>`
      : `<div class="panel empty" style="padding:26px"><div class="big">🎉</div><p>برای امروز کاری نمانده.${upcoming ? `<br><span class="muted">مرور بعدی: ${whenText(daysBetween(t, upcoming.due))}</span>` : ""}</p></div>`}
    <h2>لغت‌ها در هر مرحله</h2>${stageChips()}`;
}
function viewSession(){
  const s = session, id = s.queue[0], w = words.get(id);
  const pct = Math.round(100 * s.done / s.total);
  const nextGood = STAGES[Math.min(w.stage+1, STAGES.length-1)], nextEasy = STAGES[Math.min(w.stage+2, STAGES.length-1)];
  return `<div class="muted" style="display:flex;justify-content:space-between"><span>${s.done} از ${s.total}</span><span>${stageLabel(w.stage)}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="card" data-act="flip">${frontHTML(w,"en")}${s.revealed ? `<hr>${backHTML(w,"en").split("<hr>").slice(1).join("")}` : `<div class="hint">برای دیدن معنی بزن</div>`}</div>
    ${s.revealed
      ? `<div class="grades">
          <button class="g-again" data-act="grade" data-g="again">بلد نبودم<small>دوباره امروز</small></button>
          <button class="g-good" data-act="grade" data-g="good">بلد بودم<small>${whenText(nextGood)}</small></button>
          <button class="g-easy" data-act="grade" data-g="easy">خیلی آسون<small>${whenText(nextEasy)}</small></button></div>`
      : `<button class="btn" data-act="flip">نشان بده</button>`}
    <p style="text-align:center"><button class="btn ghost small" data-act="endsession">پایان مرور</button></p>`;
}

/* --- همه لغت‌ها --- */
function viewAll(){
  if (!live().length) return `<div class="empty"><div class="big">📭</div><p>هنوز لغتی نیست.</p></div>`;
  return `<input type="search" id="q" placeholder="جستجو در لغت یا معنی…" autocomplete="off" dir="auto">
    <div class="panel" id="list" style="padding:6px 14px"></div>`;
}
function renderList(){
  const q = ($("#q")?.value || "").trim().toLowerCase(), t = today();
  const items = live().filter(w => !q || [w.word,w.fa,w.en,w.tags].join(" ").toLowerCase().includes(q))
                      .sort((a,b) => a.word.localeCompare(b.word));
  $("#list").innerHTML = items.length ? items.map(w => `<div class="row" data-act="open" data-id="${esc(w.id)}">
      <span class="w">${esc(w.word)}</span><span class="m">${esc(w.fa)}</span>
      <span class="badge ${w.due <= t ? "due" : ""}">${stageLabel(w.stage)}</span></div>`).join("")
    : `<div class="empty" style="padding:20px">چیزی پیدا نشد</div>`;
}
function openWord(id){
  const w = words.get(id); if (!w) return;
  $("#modal").innerHTML = `<div class="sheet-bg" data-act="close"><div class="sheet" data-nofocus>
    ${fullCardHTML(w)}
    <p class="muted" style="text-align:center">${stageLabel(w.stage)} · مرور بعدی: ${w.due <= today() ? "الان" : whenText(daysBetween(today(), w.due))}</p>
    <div class="two"><button class="btn bad" data-act="del" data-id="${esc(w.id)}">حذف</button>
    <button class="btn soft" data-act="reset" data-id="${esc(w.id)}">برگشت به روز 0</button></div>
    <p style="margin-top:10px"><button class="btn ghost" data-act="close">بستن</button></p></div></div>`;
}

/* --- تست (بدون تأثیر روی زمان‌بندی) --- */
function viewTest(){
  if (!live().length) return `<div class="empty"><div class="big">🎯</div><p>اول لغت وارد کن.</p></div>`;
  if (test.list) {
    const w = words.get(test.list[test.i]);
    return `<div class="muted" style="display:flex;justify-content:space-between"><span>${test.i+1} از ${test.list.length}</span><span>حالت تست · روی زمان‌بندی اثر ندارد</span></div>
      <div class="progress"><i style="width:${Math.round(100*(test.i+1)/test.list.length)}%"></i></div>
      <div class="card" data-act="tflip">${frontHTML(w,test.dir)}${test.shown ? `<hr>${backHTML(w,test.dir).split("<hr>").slice(test.dir==="fa"?1:1).join("")}` : `<div class="hint">برای دیدن پشت کارت بزن</div>`}</div>
      <div class="two"><button class="btn ghost" data-act="tprev">قبلی</button><button class="btn" data-act="tnext">بعدی</button></div>
      <p style="text-align:center"><button class="btn ghost small" data-act="tend">خروج از تست</button></p>`;
  }
  const opts = STAGES.map((d,i) => `<option value="${i}" ${test.stage==String(i)?"selected":""}>فقط ${stageLabel(i)}</option>`).join("");
  return `<div class="panel"><p class="muted" style="margin-top:0">اینجا می‌توانی هر لغتی را هر چند بار که خواستی مرور کنی، بدون این‌که زمان‌بندی تغییر کند.</p>
    <label class="f">کدام لغت‌ها؟</label>
    <select id="t-stage"><option value="all" ${test.stage==="all"?"selected":""}>همه‌ی لغت‌ها</option><option value="due" ${test.stage==="due"?"selected":""}>فقط سررسیدشده‌ها</option>${opts}</select>
    <div class="two"><div><label class="f">جهت</label><select id="t-dir"><option value="en" ${test.dir==="en"?"selected":""}>انگلیسی ← فارسی</option><option value="fa" ${test.dir==="fa"?"selected":""}>فارسی ← انگلیسی</option></select></div>
    <div><label class="f">ترتیب</label><select id="t-mode"><option value="shuffle" ${test.mode==="shuffle"?"selected":""}>تصادفی</option><option value="alpha" ${test.mode==="alpha"?"selected":""}>الفبایی</option></select></div></div>
    <p><button class="btn" data-act="tstart">شروع</button></p></div>`;
}

/* --- داده‌ها --- */
function viewData(){
  return `<div class="panel"><h2 style="margin-top:0">وارد کردن لغت</h2>
    <p class="muted" style="margin-top:0">لغت‌های تازه خودکار روی «روز 0» می‌نشینند. لغتی که از قبل داری دست نمی‌خورد (مگر این‌که فایل پشتیبان جدیدتر باشد).</p>
    <button class="btn" data-act="pickfile">انتخاب فایل JSON</button>
    <label class="f">یا متن JSON را این‌جا بچسبان</label>
    <textarea id="paste" placeholder='{"words":[{"word":"resilient","fa":"تاب‌آور"}]}'></textarea>
    <p><button class="btn ghost" data-act="importpaste">وارد کردن متن</button></p>
    <details><summary>فرمت فایل چیست؟</summary>
<pre>{"words":[{
  "word": "resilient",
  "ipa": "/rɪˈzɪliənt/",
  "pos": "adj.",
  "fa": "تاب‌آور",
  "en": "able to recover quickly",
  "example": "He proved remarkably resilient.",
  "exampleFa": "او فوق‌العاده تاب‌آور نشان داد.",
  "related": "resilience (n.)",
  "tags": "personality"
}]}</pre><p class="muted">فقط «word» اجباری است.</p></details></div>
  <div class="panel"><h2 style="margin-top:0">پشتیبان و انتقال</h2>
    <p class="muted" style="margin-top:0">پشتیبان کامل شامل مرحله و زمان مرور هر لغت است. آن را برای خودت در تلگرام بفرست و در دستگاه دیگر وارد کن؛ نسخه‌ی جدیدتر هر لغت برنده می‌شود.</p>
    <button class="btn" data-act="exportjson">گرفتن پشتیبان (JSON)</button>
    <p><button class="btn ghost" data-act="exportanki">خروجی برای Anki (TSV)</button></p>
    <p class="muted" id="persist"></p></div>`;
}

/* ---------- ورودی و خروجی ---------- */
function normalize(x){
  const word = String(x.word || "").trim(); if (!word) return null;
  const g = k => String(x[k] ?? "").trim();
  return {id: String(x.id || word.toLowerCase()), word, ipa: g("ipa"), pos: g("pos"), fa: g("fa"), en: g("en"),
          example: g("example"), exampleFa: g("exampleFa"), related: g("related"), tags: g("tags"), source: g("source")};
}
async function importText(text){
  let data; try { data = JSON.parse(text); } catch { return toast("فایل JSON معتبر نیست"); }
  const list = Array.isArray(data) ? data : data.words;
  if (!Array.isArray(list)) return toast("لیست لغت‌ها پیدا نشد");
  let added = 0, updated = 0, skipped = 0;
  for (const raw of list) {
    const n = normalize(raw); if (!n) { skipped++; continue; }
    const hasState = Number.isFinite(raw.updatedAt) && Number.isInteger(raw.stage) && /^\d{4}-\d\d-\d\d$/.test(raw.due || "");
    const old = words.get(n.id);
    if (!old || (old.deleted && !hasState)) {                      // لغت تازه → روز 0
      await put({...n, stage: hasState ? Math.min(raw.stage, STAGES.length-1) : 0, due: hasState ? raw.due : today(),
                 updatedAt: hasState ? raw.updatedAt : Date.now(), deleted: hasState ? !!raw.deleted : false});
      added++;
    } else if (hasState && raw.updatedAt > old.updatedAt) {        // ادغام: جدیدترین برنده است
      await put({...n, stage: Math.min(raw.stage, STAGES.length-1), due: raw.due, updatedAt: raw.updatedAt, deleted: !!raw.deleted});
      updated++;
    } else skipped++;
  }
  toast(`${added} لغت جدید · ${updated} به‌روز · ${skipped} ردشده`);
  session = null; render();
}
async function saveFile(name, text, mime){
  const file = new File([text], name, {type: mime});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file]}); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const clean = s => String(s ?? "").replace(/[\t\r\n]+/g, " ");
function ankiTSV(){
  const rows = live().map(w => {
    const front = `<div dir="ltr"><b>${esc(w.word)}</b><br>${esc(w.ipa)}${w.pos ? ` (${esc(w.pos)})` : ""}<br><br><i>${esc(w.example)}</i></div>`;
    const back = `<div dir="rtl">${esc(w.fa)}</div><br><div dir="ltr">${esc(w.en)}</div><br><div dir="rtl"><i>${esc(w.exampleFa)}</i></div>` + (w.related ? `<br><div dir="ltr">related: ${esc(w.related)}</div>` : "");
    const tags = (w.tags + " " + w.pos).split(/[\s,]+/).filter(Boolean).join(" ");
    return [clean(front), clean(back), clean(tags)].join("\t");
  });
  return ["#separator:tab","#html:true","#notetype:Basic (and reversed card)","#deck:Vocab","#tags column:3", ...rows].join("\n") + "\n";
}

/* ---------- رویدادها ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  if (t.dataset.act === "close" && e.target !== t && t.classList.contains("sheet-bg")) return; // کلیک داخل برگه
  const act = t.dataset.act;
  if (act === "tab") { tab = t.dataset.tab; render(); }
  else if (act === "speak") { e.stopPropagation(); speak(t.dataset.text); }
  else if (act === "start") { const q = dueList().map(w => w.id); session = {queue: q, total: q.length, done: 0, revealed: false}; render(); }
  else if (act === "flip") { session.revealed = true; render(); }
  else if (act === "grade") {
    const id = session.queue.shift(), w = words.get(id), g = t.dataset.g;
    await grade(w, g);
    if (g === "again") session.queue.push(id); else session.done++;
    session.revealed = false;
    if (!session.queue.length) { session = null; toast("مرور امروز تمام شد 🎉"); }
    render();
  }
  else if (act === "endsession") { session = null; render(); }
  else if (act === "open") openWord(t.dataset.id);
  else if (act === "close") $("#modal").innerHTML = "";
  else if (act === "del") { const w = words.get(t.dataset.id); w.deleted = true; w.updatedAt = Date.now(); await put(w); $("#modal").innerHTML = ""; toast("حذف شد"); render(); }
  else if (act === "reset") { const w = words.get(t.dataset.id); w.stage = 0; w.due = today(); w.updatedAt = Date.now(); await put(w); $("#modal").innerHTML = ""; toast("به روز 0 برگشت"); render(); }
  else if (act === "tstart") {
    test.stage = $("#t-stage").value; test.dir = $("#t-dir").value; test.mode = $("#t-mode").value;
    let L = live(); const t0 = today();
    if (test.stage === "due") L = L.filter(w => w.due <= t0); else if (test.stage !== "all") L = L.filter(w => w.stage === Number(test.stage));
    if (!L.length) return toast("لغتی با این فیلتر نیست");
    L = test.mode === "shuffle" ? shuffle(L) : L.sort((a,b) => a.word.localeCompare(b.word));
    test.list = L.map(w => w.id); test.i = 0; test.shown = false; render();
  }
  else if (act === "tflip") { test.shown = !test.shown; render(); }
  else if (act === "tnext") { test.i = (test.i + 1) % test.list.length; test.shown = false; render(); }
  else if (act === "tprev") { test.i = (test.i - 1 + test.list.length) % test.list.length; test.shown = false; render(); }
  else if (act === "tend") { test.list = null; render(); }
  else if (act === "pickfile") $("#file").click();
  else if (act === "importpaste") { const v = $("#paste").value.trim(); if (v) await importText(v); else toast("چیزی نچسبانده‌ای"); }
  else if (act === "exportjson") { await saveFile(`vocab-backup-${today()}.json`, JSON.stringify({app: "vocab", version: 1, exported: new Date().toISOString(), words: [...words.values()]}, null, 1), "text/plain"); }
  else if (act === "exportanki") { await saveFile(`vocab-anki-${today()}.txt`, ankiTSV(), "text/plain"); }
});
document.addEventListener("input", e => { if (e.target.id === "q") renderList(); });
$("#file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  await importText(await f.text()); e.target.value = "";
});

/* ---------- شروع ---------- */
(async () => {
  try {
    db = await openDB();
    (await loadAll()).forEach(w => words.set(w.id, w));
  } catch (err) { $("#view").innerHTML = `<div class="empty">دسترسی به حافظه‌ی مرورگر ممکن نیست.<br>(حالت خصوصی؟)</div>`; return; }
  render();
  if ("speechSynthesis" in window) speechSynthesis.getVoices();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => { window.__persisted = ok; });
})();
</script>
