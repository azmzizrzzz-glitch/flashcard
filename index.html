<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>لغت‌نامه</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f2ea;--card:#fffdf8;--ink:#1d2421;--mute:#626c66;--line:#e4ddd0;
  --acc:#1f6f5c;--acc-ink:#fff;--acc-soft:#dcebe5;--bad:#a8432a;--bad-soft:#f6e1da;--ok-soft:#dcebe5;
  --star:#b98014;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(40,50,45,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121819;--card:#1b2325;--ink:#e8ece9;--mute:#8e9a95;--line:#2a3437;
    --acc:#4fb596;--acc-ink:#0d1f1a;--acc-soft:#1f3a33;--bad:#e0846a;--bad-soft:#3a2520;--ok-soft:#1f3a33;
    --star:#e7bd57;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px*var(--fscale,1))}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Vazirmatn","Vazir","Segoe UI",system-ui,-apple-system,"Noto Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;
  font-size:calc(16px*var(--fscale,1));line-height:1.7;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{padding:max(18px,env(safe-area-inset-top)) 0 6px;display:flex;align-items:baseline;justify-content:space-between}
header h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:-.01em}
header .sub{color:var(--mute);font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.5rem}
.stat span{color:var(--mute);font-size:.75rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0;box-shadow:var(--shadow)}
.btn{display:inline-block;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:14px;
  padding:12px 22px;font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--acc-soft);color:var(--acc)}
.btn.ghost{background:transparent;color:var(--acc);border-color:var(--line)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{padding:8px 14px;font-size:.85rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{font-size:.78rem;padding:4px 12px;border-radius:99px;background:var(--acc-soft);color:var(--acc);font-weight:600}
.fchip{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:4px 14px;border-radius:14px;
  border:1px solid var(--line);background:var(--card);font-size:.9rem;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit}
.fchip small{font-weight:400;font-size:.78rem;color:var(--mute)}
.fchip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.fchip.on small{color:var(--acc-ink);opacity:.8}
.fchip:disabled{opacity:.4;cursor:default}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .w{font-weight:700;direction:ltr;min-width:96px;text-align:left}
.row .m{flex:1;color:var(--mute);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:.74rem;padding:2px 9px;border-radius:99px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.badge.due{background:var(--bad-soft);color:var(--bad)}
input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;min-height:46px;font-family:inherit;font-size:1rem;color:var(--ink)}
textarea{min-height:120px;direction:ltr;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
textarea.promptbox{direction:rtl;font-family:inherit;font-size:.85rem;line-height:1.9;min-height:260px;resize:vertical}
label.f{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-size:.68rem;min-height:60px;overflow:hidden;background:none;border:0;cursor:pointer;font-family:inherit}
nav button span{font-size:1.15rem;line-height:1}
@media (max-width:359px){nav button{font-size:.6rem}}
nav button.on{color:var(--acc);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .card{min-height:0;cursor:default;margin-top:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:20;font-size:.9rem;max-width:90vw}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.empty .big{font-size:2.6rem}
details{margin:10px 0}summary{cursor:pointer;color:var(--acc);font-weight:600}
pre{direction:ltr;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;font-size:.78rem}
.muted{color:var(--mute);font-size:.88rem}
h2{font-size:1.05rem;margin:18px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;margin:14px 0;cursor:pointer;position:relative}
.card .word{font-size:2.2rem;font-weight:800;direction:ltr}
.card .fa-big{font-size:1.9rem;font-weight:800}
.card .ipa{color:var(--mute);direction:ltr;font-size:1rem}
.card .fa{font-size:1.25rem;font-weight:700}
.card .en{direction:ltr;color:var(--mute)}
.card .ex{direction:ltr;font-style:italic;color:var(--mute);font-size:.95rem}
.card .exfa{color:var(--mute);font-size:.92rem}
.card .rel{direction:ltr;color:var(--acc);font-size:.9rem}
.card .hint{color:var(--mute);font-size:.85rem}
.card hr{width:100%;border:0;border-top:1px dashed var(--line);margin:4px 0}
.card input#ans{width:100%;max-width:300px;min-height:52px;font-size:1.25rem;text-align:center;border-radius:14px;
  border:1.5px solid var(--line);background:var(--bg);padding:8px 14px;font-family:inherit;color:var(--ink)}
.starbtn{position:absolute;top:10px;inset-inline-start:10px;width:42px;height:42px;border-radius:50%;font-size:1.45rem;
  color:var(--mute);display:inline-flex;align-items:center;justify-content:center;line-height:1;background:none;border:0;cursor:pointer}
.starbtn.on{color:var(--star)}
.starbtn.inline{position:static;width:34px;height:34px;font-size:1.15rem;flex:none}
.speakbar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font-size:1.15rem;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn.mini{width:34px;height:34px;font-size:1rem;flex:none}
.diff{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px;direction:ltr;text-align:left}
.difflabel{font-size:.75rem;color:var(--mute);margin-top:6px}
.diffrow{font-size:1.2rem;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;line-height:1.7}
.d-ok{color:var(--acc)}
.d-bad{color:var(--bad);text-decoration:line-through}
.d-miss{color:var(--acc);font-weight:700;text-decoration:underline}
.res-good{background:var(--acc-soft);border-color:var(--acc)}
.res-bad{background:var(--bad-soft);border-color:var(--bad)}
.resline{font-weight:800;font-size:1.15rem}
.res-good .resline{color:var(--acc)}
.res-bad .resline{color:var(--bad)}
.grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0}
.grades button{border-radius:14px;padding:12px 6px;font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.grades small{display:block;font-weight:400;font-size:.72rem;color:var(--mute);margin-top:2px}
.g-again{border-color:var(--bad)!important;color:var(--bad)!important;background:var(--bad-soft)!important}
.g-good{border-color:var(--acc)!important;color:var(--acc)!important;background:var(--ok-soft)!important}
.g-easy{border-color:var(--acc)!important;color:var(--acc-ink)!important;background:var(--acc)!important}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .25s}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>لغت‌نامه</h1><span class="sub" id="sub"></span></header>
  <main id="view"></main>
</div>
<nav><div class="in" id="nav"></div></nav>
<input type="file" id="file" accept=".json,application/json,text/plain" hidden>
<div id="modal"></div>
<div id="toast"></div>

<script>
"use strict";
/* ---------- تنظیمات ---------- */
// فاصله‌ی مرورها (روز). مرحله‌ی ۰ = همان امروز (لغت تازه وارد شده)، آخرین مرحله = روز ۹۰
const STAGES = [0, 1, 3, 7, 14, 30, 60, 90];

/* ---------- ابزارهای کوچک ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => fmt(new Date());
const addDays = (s, n) => { const [y,m,d] = s.split("-").map(Number); return fmt(new Date(y, m-1, d+n)); };
const daysBetween = (a, b) => Math.round((new Date(b+"T00:00") - new Date(a+"T00:00")) / 864e5);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function toast(msg){
  const t = $("#toast"); t.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.innerHTML = "", 2600);
}

/* ---------- پایگاه داده (IndexedDB) ---------- */
let db; const words = new Map();
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open("vocab", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("words", {keyPath: "id"});
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const store = mode => db.transaction("words", mode).objectStore("words");
const loadAll = () => new Promise(res => { const q = store("readonly").getAll(); q.onsuccess = () => res(q.result); });
const put = w => { words.set(w.id, w); return new Promise(res => { const r = store("readwrite").put(w); r.onsuccess = res; r.onerror = res; }); };
const live = () => [...words.values()].filter(w => !w.deleted);

/* ---------- منطق مرور ---------- */
const dueList = () => { const t = today(); return live().filter(w => !w.typingOnly && w.due <= t).sort((a,b) => a.due.localeCompare(b.due) || a.stage - b.stage); };   // لغت‌های «فقط تایپ» وارد مرور اصلی نمی‌شوند
const stageLabel = s => `روز ${STAGES[s]}`;
const whenText = n => n === 0 ? "همین الان" : n === 1 ? "فردا" : `${n} روز بعد`;

async function grade(w, g){
  if (g === "again") { w.stage = 0; w.due = today(); }
  else { w.stage = Math.min(w.stage + (g === "easy" ? 2 : 1), STAGES.length - 1); w.due = addDays(today(), STAGES[w.stage]); }
  w.updatedAt = Date.now();
  await put(w);
}

/* ---------- تلفظ ---------- */
let rate = 1;   // سرعت پیش‌فرض پخش — فقط از تب «تنظیمات» تغییر می‌کند
try { rate = parseFloat(localStorage.getItem("vocab-rate")) || 1; } catch (e) {}
function setRate(r){ rate = r; try { localStorage.setItem("vocab-rate", String(r)); } catch (e) {} }
/* اندازه‌ی فونت — فقط از تب «تنظیمات» */
const FSSIZES = [[.9,"۹۰٪"],[1,"۱۰۰٪"],[1.15,"۱۱۵٪"],[1.3,"۱۳۰٪"]];
let fscale = 1;
try { fscale = parseFloat(localStorage.getItem("vocab-fs")) || 1; } catch (e) {}
function applyFs(v){
  if (!Number.isFinite(v)) return;
  fscale = v;
  document.documentElement.style.setProperty("--fscale", String(v));
  try { localStorage.setItem("vocab-fs", String(v)); } catch (e) {}
}
applyFs(fscale);
function speak(text){
  if (!("speechSynthesis" in window)) return toast("این مرورگر تلفظ را پشتیبانی نمی‌کند");
  const synth = window.speechSynthesis; synth.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = "en-US";
  u.rate = rate;
  const v = synth.getVoices().find(v => v.lang.replace("_","-").toLowerCase() === "en-us") || synth.getVoices().find(v => v.lang.toLowerCase().startsWith("en"));
  if (v) u.voice = v; else if (synth.getVoices().length) toast("صدای انگلیسی روی این دستگاه نصب نیست");
  synth.speak(u);
}

/* ---------- نمایش کارت ---------- */
const RATES = [[1,"۱۰۰٪"],[.75,"۷۵٪"],[.5,"۵۰٪"],[.25,"۲۵٪"]];   // چیپ‌های سرعت فقط در تب «تنظیمات»
const spk = (w, mini) => `<button class="icon-btn${mini ? " mini" : ""}" data-act="speak" data-text="${esc(w.word)}" data-id="${esc(w.id)}" aria-label="تلفظ">🔊</button>`;
const speakBar = w => `<div class="speakbar">${spk(w)}</div>`;
const starBtn = (w, inline) => `<button class="starbtn${inline ? " inline" : ""}${w.star ? " on" : ""}" data-act="star" data-id="${esc(w.id)}" aria-label="ستاره">${w.star ? "★" : "☆"}</button>`;
function frontHTML(w, dir){
  if (dir === "fa") return `<div class="fa-big" dir="rtl">${esc(w.fa)}</div>`;
  return `<div class="word" data-act="speak" data-text="${esc(w.word)}" data-id="${esc(w.id)}">${esc(w.word)}</div>
          <div class="ipa">${esc(w.ipa)}${w.pos ? " · " + esc(w.pos) : ""}</div>${speakBar(w)}`;
}
function detailsHTML(w){
  return `${w.en ? `<div class="en">${esc(w.en)}</div>` : ""}
    ${w.example ? `<div class="ex">${esc(w.example)}</div>` : ""}
    ${w.exampleFa ? `<div class="exfa">${esc(w.exampleFa)}</div>` : ""}
    ${w.related ? `<div class="rel">${esc(w.related)}</div>` : ""}`;
}
function backHTML(w, dir){
  if (dir === "fa") return `<div class="word" data-act="speak" data-text="${esc(w.word)}" data-id="${esc(w.id)}">${esc(w.word)}</div>
      <div class="ipa">${esc(w.ipa)}${w.pos ? " · " + esc(w.pos) : ""}</div>${speakBar(w)}<hr>${detailsHTML(w)}`;
  return `<div class="fa">${esc(w.fa)}</div><hr>${detailsHTML(w)}`;
}
function fullCardHTML(w){
  return `<div class="card" data-nofocus>${starBtn(w)}
    <div class="word" data-act="speak" data-text="${esc(w.word)}" data-id="${esc(w.id)}">${esc(w.word)}</div>
    <div class="ipa">${esc(w.ipa)}${w.pos ? " · " + esc(w.pos) : ""}</div>${speakBar(w)}
    <div class="fa">${esc(w.fa)}</div><hr>${detailsHTML(w)}</div>`;
}

/* ---------- وضعیت صفحه ---------- */
let tab = "today";
let session = null;               // مرور امروز
let test = {stage: "all", tag: "all", star: "all", dir: "en", mode: "shuffle", list: null, i: 0, shown: false};
let typer = {stage: "all", tag: "all", star: "all", mode: "shuffle", list: null, i: 0, state: "ask", typed: "", ok: false};   // زمان‌بندی مستقل تایپ: tstage/tdue روی هر لغت

const TABS = [["today","📅","امروز"],["all","📚","لغت‌ها"],["type","⌨","تایپ"],["test","🎯","تست"],["data","💾","داده‌ها"],["settings","⚙️","تنظیمات"]];
function renderNav(){
  $("#nav").innerHTML = TABS.map(([k,ic,l]) => `<button data-act="tab" data-tab="${k}" class="${tab===k?"on":""}"><span>${ic}</span>${l}</button>`).join("");
}
function render(){
  renderNav();
  const dueN = dueList().length;
  $("#sub").textContent = live().length ? `${live().length} لغت · ${dueN} برای امروز` : "";
  $("#view").innerHTML = ({today: viewToday, all: viewAll, type: viewType, test: viewTest, data: viewData, settings: viewSettings})[tab]();
  if (tab === "all") renderList();
  if (tab === "data") renderPersist();
  if (tab === "type" && typer.list && typer.state === "ask") {
    const el = $("#ans"); if (el) { el.value = typer.typed; setTimeout(() => el.focus(), 30); }
  }
  window.scrollTo(0, 0);
}

/* --- چیپ‌های فیلتر مشترک بین تست و تایپ (ty=true یعنی شمارش با زمان‌بندی مخصوص تایپ) --- */
function filterChips(st, P, ty){
  const t0 = today(), all = live();
  // لغت‌های «فقط تایپ» فقط در بخش تایپ شمرده می‌شوند؛ در مرور اصلی و تست نیستند
  const base = ty ? all : all.filter(w => !w.typingOnly);
  const gS = w => ty ? (Number.isInteger(w.tstage) ? w.tstage : 0) : w.stage;
  const gD = w => ty ? (typeof w.tdue === "string" ? w.tdue : t0) : w.due;
  const counts = STAGES.map(() => 0); base.forEach(w => { const s = gS(w); if (s >= 0 && s < STAGES.length) counts[s]++; });
  const dueN = base.filter(w => gD(w) <= t0).length;
  const starN = base.filter(w => w.star).length;
  const chip = (on, act, val, label, n, dis) =>
    `<button class="fchip${on ? " on" : ""}" data-act="${act}" data-val="${esc(val)}"${dis ? " disabled" : ""}>${label}${n != null ? `<small>${n}</small>` : ""}</button>`;
  const stageChips = [chip(st.stage==="all", P+"stage", "all", "همه", base.length),
      chip(st.stage==="due", P+"stage", "due", "سررسیدشده", dueN, !dueN),
      ...STAGES.map((d,i) => chip(st.stage===String(i), P+"stage", String(i), stageLabel(i), counts[i], !counts[i]))].join("");
  const starChips = chip(st.star==="all", P+"star", "all", "همه", base.length) +
      chip(st.star==="star", P+"star", "star", "★ ستاره‌دار", starN, !starN);
  const tagCounts = {};
  base.forEach(w => String(w.tags||"").split(/[\s,،]+/).filter(Boolean).forEach(tg => tagCounts[tg] = (tagCounts[tg]||0)+1));
  const tagList = Object.keys(tagCounts).sort().slice(0, 12);
  const tagChips = tagList.map(tg => chip(st.tag===tg, P+"tag", tg, tg, tagCounts[tg])).join("");
  const pool = base.filter(w =>
    (st.stage==="all" || (st.stage==="due" ? gD(w)<=t0 : gS(w)===Number(st.stage))) &&
    (st.star==="all" || !!w.star) &&
    (st.tag==="all" || String(w.tags||"").split(/[\s,،]+/).includes(st.tag)));
  return {stageChips, starChips, tagChips, pool, hasTags: tagList.length > 0, total: base.length, chip};
}

/* --- امروز --- */
function stageChips(){
  const c = STAGES.map(() => 0); live().forEach(w => { if (!w.typingOnly) c[w.stage]++; });
  return `<div class="chips">${c.map((n,i) => n ? `<span class="chip">${stageLabel(i)}: ${n}</span>` : "").join("")}</div>`;
}
function viewToday(){
  const all = live();
  if (!all.length) return `<div class="empty"><div class="big">🌱</div><p>هنوز لغتی نداری.<br>از بخش «داده‌ها» فایل لغت‌ها را وارد کن.</p>
    <button class="btn" data-act="tab" data-tab="data">رفتن به داده‌ها</button></div>`;
  if (session) return viewSession();
  const due = dueList(), t = today();

  return `<div class="stats">

// دیف حرف‌به‌حرف بین جواب تایپی و املای درست (بر پایه‌ی طولانی‌ترین زیررشته‌ی مشترک)
function diffBlock(typed, target){
  const norm = s => s.trim().toLowerCase().replace(/\s+/g, " ");
  const a = norm(typed), b = norm(target);
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, () => new Array(n+1).fill(0));
  for (let i=m-1;i>=0;i--) for (let j=n-1;j>=0;j--)
    dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  let i = 0, j = 0; const T = [], G = [];
  while (i < m && j < n){
    if (a[i]===b[j]) { T.push(["ok",a[i]]); G.push(["ok",b[j]]); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]) { T.push(["bad",a[i]]); i++; }
    else { G.push(["miss",b[j]]); j++; }
  }
  while (i < m){ T.push(["bad",a[i]]); i++; }
  while (j < n){ G.push(["miss",b[j]]); j++; }
  const render = ms => ms.map(([s,c]) => `<span class="d-${s}">${esc(c)}</span>`).join("");
  return `<div class="diff"><div class="difflabel" style="margin-top:0">نوشته‌ی تو:</div><div class="diffrow">${render(T)}</div>
    <div class="difflabel">املای درست:</div><div class="diffrow">${render(G)}</div></div>`;
}

/* پرامپت دائمی برای ساختن لغت با هر هوش مصنوعی — در تب «تنظیمات» نمایش و کپی می‌شود */
const AI_PROMPT = `تو از این لحظه «دستیار لغت‌نامه‌ی من» هستی و این دستور تا پایان گفتگو معتبر است؛ لازم نیست دوباره تکرارش کنی. من سطح B1 انگلیسی دارم.

روش کار: من در هر پیام بعدی یا عکسِ صفحه‌ی کتاب/مقاله می‌فرستم یا چند لغت می‌نویسم یا هر دو. در برابر هر پیام من فقط یک کار داری: ساختن لغت‌ها در قالب JSON زیر و هیچ چیز دیگری — نه توضیح، نه ترجمه‌ی متنی، نه سؤال.

شکل خروجی (همیشه دقیقاً همین‌طور، فقط JSON خام):
{"words":[{"word":"...","ipa":"...","pos":"...","fa":"...","en":"...","example":"...","exampleFa":"...","related":"...","tags":"..."}]}

معنی فیلدها:
- word: خود لغت انگلیسی یا عبارت مفید، همان‌طور که در عکس یا پیام من آمده
- ipa: تلفظ آی‌پی‌ای مثل /rɪˈzɪliənt/ — اگر مطمئن نیستی ""
- pos: n. یا v. یا adj. یا adv. یا prep.
- fa: معنی فارسی کوتاه و دقیق
- en: تعریف ساده‌ی انگلیسی در یک عبارت کوتاه
- example: یک جمله‌ی انگلیسی ساده و طبیعی با آن لغت، نزدیک به موضوع متن من
- exampleFa: ترجمه‌ی فارسی همان جمله
- related: حداکثر ۳ کلمه‌ی هم‌خانواده یا مترادف، با ویرگول جدا؛ نبود ""
- tags: فقط یک برچسب موضوعی کوچک انگلیسی مثل travel یا work، از موضوع متن من
- typingOnly: فقط وقتی در پیامم برای لغتی نوشته‌ام «فقط برای تایپ»، همان لغت را با "typingOnly": true بساز؛ در غیر این صورت این فیلد را اصلاً ننویس

قوانین:
۱. فقط JSON خام بده؛ بدون \`\`\` و بدون هیچ متن، عنوان یا توضیحی قبل و بعدش.
۲. فیلدهای id، stage، due، tstage، tdue، star، updatedAt را هیچ‌وقت نساز؛ برنامه‌ی من خودش می‌سازد.
۳. فقط لغت‌هایی را که معنی‌شان را مطمئن می‌دانی بنویس؛ از خودت لغت یا معنی نساز و لغت مشکوک را حذف کن.
۴. هر پاسخ حداکثر ۳۰ لغت؛ مهم‌ترین‌ها را انتخاب کن. اگر پیام من فقط کلمه‌ی «ادامه» بود، بقیه‌ی لغت‌های مهم همان متن قبلی را در همان قالب JSON بده.
۵. لغتی که در همین گفتگو قبلاً داده‌ای را تکرار نکن.
۶. اگر هم عکس فرستادم و هم لغت نوشتم، اول دقیقاً لغت‌های نوشته‌شده‌ی من را بساز، بعد لغت‌های مهم عکس را.
۷. اگر لغت‌هایی که نوشتم فارسی بودند، رایج‌ترین معادل انگلیسی‌شان را در word بگذار و معنی فارسی خودم را در fa بنویس.
۸. JSON استاندارد: کوتیشن دوتایی، بدون ویرگول اضافه در آخر، و فارسی را مستقیم بنویس نه با کد \\u.

حالا فقط بنویس: «آماده‌ام» — و از پیام بعدی، جواب‌هایت فقط همان JSON باشد.`;

}]}</pre><p class="muted">فقط «word» اجباری است؛ فیلد اختیاری «typingOnly»: true یعنی این لغت فقط برای تمرین تایپ است و در مرور اصلی نمی‌آید (بعداً از صفحه‌ی خود لغت هم می‌توانی تغییرش بدهی).</p></details></div>
  <div class="panel"><h2 style="margin-top:0">پشتیبان و انتقال</h2>
    <p class="muted" style="margin-top:0">پشتیبان کامل شامل مرحله و زمان مرور، مرحله و زمان تایپ، و ستاره‌ی هر لغت است. آن را برای خودت در تلگرام بفرست و در دستگاه دیگر وارد کن؛ نسخه‌ی جدیدتر هر لغت برنده می‌شود.</p>
    <button class="btn" data-act="exportjson">گرفتن پشتیبان (JSON)</button>
    <p><button class="btn ghost" data-act="exportanki">خروجی برای Anki (TSV)</button></p>
    <p class="muted" id="persist"></p></div>`;
}
function renderPersist(){
  const el = $("#persist"); if (!el) return;
  const est = navigator.storage && navigator.storage.estimate ? navigator.storage.estimate() : Promise.resolve(null);
  const per = navigator.storage && navigator.storage.persisted ? navigator.storage.persisted() : Promise.resolve(null);
  Promise.all([est, per]).then(([e, ok]) => {
    const kb = e && e.usage ? ` (${(e.usage / 1024).toFixed(0)} کیلوبایت)` : "";
    const g = ok == null ? "" : ok ? " · محافظت در برابر پاک‌سازی خودکار: فعال" : " · محافظت در برابر پاک‌سازی خودکار: غیرفعال";
    el.textContent = `داده‌ها هر لحظه به‌صورت خودکار روی همین دستگاه ذخیره می‌شود${kb}${g}. پشتیبان‌گیری فقط برای انتقال به دستگاه دیگر یا نسخه‌ی احتیاطی است.`;
  }).catch(() => {});
}

/* ---------- ورودی و خروجی ---------- */
const KNOWN = new Set(["id","word","ipa","pos","fa","en","example","exampleFa","related","tags","source","typingOnly","stage","due","updatedAt","deleted"]);
function normalize(x){
  const word = String(x.word || "").trim(); if (!word) return null;
  const g = k => String(x[k] ?? "").trim();
  const extra = {};   // فیلدهای ناشناخته (مثل star و tstage/tdue و lapses) نگه داشته می‌شوند تا در پشتیبان‌گیری از بین نروند
  for (const k of Object.keys(x))
    if (!KNOWN.has(k) && !k.startsWith("__") && /^[A-Za-z_$][\w$]*$/.test(k) && x[k] != null) extra[k] = x[k];
  const to = x.typingOnly;   // «فقط تایپ»: true/false — غایب یعنی وضعیت قبلی دست نخورد
  return {id: String(x.id || word.toLowerCase()), word, ipa: g("ipa"), pos: g("pos"), fa: g("fa"), en: g("en"),
          example: g("example"), exampleFa: g("exampleFa"), related: g("related"), tags: g("tags"), source: g("source"),
          ...(to === true || to === "true" ? {typingOnly: true} : (to === false || to === "false" ? {typingOnly: false} : {})), ...extra};
}
async function importText(text){
  let data; try { data = JSON.parse(text); } catch { return toast("فایل JSON معتبر نیست"); }
  const list = Array.isArray(data) ? data : data.words;
  if (!Array.isArray(list)) return toast("لیست لغت‌ها پیدا نشد");
  let added = 0, updated = 0, skipped = 0;
  for (const raw of list) {
    const n = normalize(raw); if (!n) { skipped++; continue; }
    const dd = raw.due ? new Date(raw.due + "T00:00") : null;
    const dueOk = !!dd && /^\d{4}-\d\d-\d\d$/.test(raw.due) && !isNaN(dd) && fmt(dd) === raw.due;
    const hasState = Number.isFinite(raw.updatedAt) && Number.isInteger(raw.stage)
      && raw.stage >= 0 && raw.stage < STAGES.length && dueOk;
    // اعتبارسنجی فیلدهای تایپ (tstage/tdue)؛ نامعتبر ⇒ حذف تا پیش‌فرض «روز 0 تایپ» استفاده شود
    const tsOk = Number.isInteger(n.tstage) && n.tstage >= 0 && n.tstage < STAGES.length;
    const tdd = typeof n.tdue === "string" ? new Date(n.tdue + "T00:00") : null;
    const tdOk = !!tdd && !isNaN(tdd) && fmt(tdd) === n.tdue;
    if (!tsOk || !tdOk) { delete n.tstage; delete n.tdue; }
    const old = words.get(n.id);
    if (!old || (old.deleted && !hasState)) {                      // لغت تازه → روز 0 (مرور و تایپ هر دو)
      await put({...old, ...n, stage: hasState ? Math.min(raw.stage, STAGES.length-1) : 0, due: hasState ? raw.due : today(),
                 updatedAt: hasState ? raw.updatedAt : Date.now(), deleted: hasState ? !!raw.deleted : false});
      added++;
    } else if (hasState && raw.updatedAt > old.updatedAt) {        // ادغام: جدیدترین برنده؛ تایپ/ستاره‌ی قدیمی اگر در فایل نبود حفظ می‌شود
      await put({...old, ...n, stage: Math.min(raw.stage, STAGES.length-1), due: raw.due, updatedAt: raw.updatedAt, deleted: !!raw.deleted});
      updated++;
    } else skipped++;
  }
  toast(`${added} لغت جدید · ${updated} به‌روز · ${skipped} ردشده`);
  session = null; render();
}
async function saveFile(name, text, mime){
  const file = new File([text], name, {type: mime});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file]}); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const clean = s => String(s ?? "").replace(/[\t\r\n]+/g, " ");
function ankiTSV(){
  const rows = live().map(w => {
    const front = `<div dir="ltr"><b>${esc(w.word)}</b><br>${esc(w.ipa)}${w.pos ? ` (${esc(w.pos)})` : ""}<br><br><i>${esc(w.example)}</i></div>`;
    const back = `<div dir="rtl">${esc(w.fa)}</div><br><div dir="ltr">${esc(w.en)}</div><br><div dir="rtl"><i>${esc(w.exampleFa)}</i></div>` + (w.related ? `<br><div dir="ltr">related: ${esc(w.related)}</div>` : "");
    const tags = (w.tags + " " + w.pos).split(/[\s,]+/).filter(Boolean).join(" ");
    return [clean(front), clean(back), clean(tags)].join("\t");
  });
  return ["#separator:tab","#html:true","#notetype:Basic (and reversed card)","#deck:Vocab","#tags column:3", ...rows].join("\n") + "\n";
}

/* ---------- رویدادها ---------- */
async function checkTyping(){
  const w = words.get(typer.list[typer.i]);
  const v = $("#ans") ? $("#ans").value : typer.typed;
  if (!v.trim()) return toast("چیزی ننوشتی");
  const norm = s => s.trim().toLowerCase().replace(/\s+/g, " ");
  typer.ok = norm(v) === norm(w.word); typer.typed = v;
  // زمان‌بندی مستقل تایپ (همان الگوی STAGES) — مرحله و تاریخ مرور کارت (stage/due) دست‌نخورده می‌مانند
  if (typer.ok) { w.tstage = Math.min((Number.isInteger(w.tstage) ? w.tstage : 0) + 1, STAGES.length - 1); w.tdue = addDays(today(), STAGES[w.tstage]); }
  else { w.tstage = 0; w.tdue = today(); }
  w.updatedAt = Date.now(); await put(w);
  if (!typer.ok) typer.list.push(w.id);                           // غلط‌ها آخر جلسه تکرار می‌شوند
  typer.state = "result"; render();
}
function advanceTyping(){
  typer.i++; typer.state = "ask"; typer.typed = "";
  if (typer.i >= typer.list.length) { typer.list = null; toast("تایپ تمام شد"); }
  render();
}
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  if (t.dataset.act === "close" && e.target !== t && t.classList.contains("sheet-bg")) return; // کلیک داخل برگه
  const act = t.dataset.act;
  if (act === "tab") { tab = t.dataset.tab; render(); }
  else if (act === "speak") { e.stopPropagation(); speak(t.dataset.text); }
  else if (act === "star") {
    e.stopPropagation();
    const w = words.get(t.dataset.id); w.star = !w.star; w.updatedAt = Date.now(); await put(w);
    if (tab === "all") { if ("#modal" && $("#modal").innerHTML) openWord(w.id); renderList(); } else render();
  }
  else if (act === "start") { const q = dueList().map(w => w.id); session = {queue: q, total: q.length, done: 0, revealed: false}; render(); }
  else if (act === "flip") { session.revealed = true; render(); }
  else if (act === "grade") {
    const id = session.queue.shift(), w = words.get(id), g = t.dataset.g;
    await grade(w, g);
    if (g === "again") session.queue.push(id); else session.done++;
    session.revealed = false;
    if (!session.queue.length) { session = null; toast("مرور امروز تمام شد 🎉"); }
    render();
  }
  else if (act === "endsession") { session = null; render(); }
  else if (act === "open") openWord(t.dataset.id);
  else if (act === "close") $("#modal").innerHTML = "";
  else if (act === "del") { const w = words.get(t.dataset.id); w.deleted = true; w.updatedAt = Date.now(); await put(w); $("#modal").innerHTML = ""; toast("حذف شد"); render(); }
  else if (act === "reset") { const w = words.get(t.dataset.id); w.stage = 0; w.due = today(); w.updatedAt = Date.now(); await put(w); $("#modal").innerHTML = ""; toast("مرور به روز 0 برگشت"); render(); }
  else if (act === "tyreset") { const w = words.get(t.dataset.id); w.tstage = 0; w.tdue = today(); w.updatedAt = Date.now(); await put(w); $("#modal").innerHTML = ""; toast("تایپ به روز 0 برگشت"); render(); }
  else if (act === "setmode") {                     // تبدیل بین «مرور اصلی» و «فقط تایپ»
    const w = words.get(t.dataset.id);
    if (t.dataset.mode === "typing") { w.typingOnly = true; toast("این لغت فقط در بخش تایپ تمرین می‌شود"); }
    else { delete w.typingOnly; toast("لغت به مرور اصلی برگشت"); }
    w.updatedAt = Date.now(); await put(w); openWord(w.id); render();
  }
  else if (act === "tstage") { test.stage = t.dataset.val; render(); }
  else if (act === "ttag") { test.tag = t.dataset.val; render(); }
  else if (act === "tstar") { test.star = t.dataset.val; render(); }
  else if (act === "rate") { setRate(parseFloat(t.dataset.r)); render(); }
  else if (act === "fs") { applyFs(parseFloat(t.dataset.v)); render(); }
  else if (act === "spktest") { speak("vocabulary"); }
  else if (act === "copyprompt") {
    try { await navigator.clipboard.writeText(AI_PROMPT); toast("پرامپت کپی شد"); }
    catch (e) {
      const ta = document.createElement("textarea"); ta.value = AI_PROMPT;
      ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand("copy"); toast("پرامپت کپی شد"); }
      catch (e2) { toast("کپی نشد — متن را از کادر بالا دستی انتخاب و کپی کن"); }
      ta.remove();
    }
  }
  else if (act === "tstart") {
    test.dir = $("#t-dir").value; test.mode = $("#t-mode").value;
    const L = filterChips(test, "t").pool;
    if (!L.length) return toast("لغتی با این فیلتر نیست");
    const S = test.mode === "shuffle" ? shuffle(L) : L.sort((a,b) => a.word.localeCompare(b.word));
    test.list = S.map(w => w.id); test.i = 0; test.shown = false; render();
  }
  else if (act === "tflip") { test.shown = !test.shown; render(); }
  else if (act === "tnext") { test.i = (test.i + 1) % test.list.length; test.shown = false; render(); }
  else if (act === "tprev") { test.i = (test.i - 1 + test.list.length) % test.list.length; test.shown = false; render(); }
  else if (act === "tend") { test.list = null; render(); }
  else if (act === "ystage") { typer.stage = t.dataset.val; render(); }
  else if (act === "ytag") { typer.tag = t.dataset.val; render(); }
  else if (act === "ystar") { typer.star = t.dataset.val; render(); }
  else if (act === "ystart") {
    typer.mode = $("#y-mode").value;
    const L = filterChips(typer, "y", true).pool;
    if (!L.length) return toast("لغتی با این فیلتر نیست");
    const S = typer.mode === "shuffle" ? shuffle(L) : L.sort((a,b) => a.word.localeCompare(b.word));
    typer.list = S.map(w => w.id); typer.i = 0; typer.state = "ask"; typer.typed = ""; render();
  }
  else if (act === "tycheck") { await checkTyping(); }
  else if (act === "tynext") { advanceTyping(); }
  else if (act === "tyend") { typer.list = null; render(); }
  else if (act === "pickfile") $("#file").click();
  else if (act === "importpaste") { const v = $("#paste").value.trim(); if (v) await importText(v); else toast("چیزی نچسبانده‌ای"); }
  else if (act === "exportjson") { await saveFile(`vocab-backup-${today()}.json`, JSON.stringify({app: "vocab", version: 1, exported: new Date().toISOString(), words: [...words.values()]}, null, 1), "text/plain"); }
  else if (act === "exportanki") { await saveFile(`vocab-anki-${today()}.txt`, ankiTSV(), "text/plain"); }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") renderList();
  if (e.target.id === "ans") typer.typed = e.target.value;         // متن تایپی وسط کار نیمه‌کاره از دست نرود
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target && e.target.id === "ans") { e.preventDefault(); checkTyping(); }
  else if (tab === "type" && typer.list && typer.state === "result"
      && !(e.target.closest && e.target.closest("button,input,select,textarea,a"))) { e.preventDefault(); advanceTyping(); }
});
$("#file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  await importText(await f.text()); e.target.value = "";
});

/* ---------- شروع ---------- */
(async () => {
  try {
    db = await openDB();
    (await loadAll()).forEach(w => words.set(w.id, w));
  } catch (err) { $("#view").innerHTML = `<div class="empty">دسترسی به حافظه‌ی مرورگر ممکن نیست.<br>(حالت خصوصی؟)</div>`; return; }
  render();
  if ("speechSynthesis" in window) speechSynthesis.getVoices();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").then(r => {
    r.addEventListener("updatefound", () => {
      const nw = r.installing; if (!nw) return;
      nw.addEventListener("statechange", () => {
        if (nw.state === "installed" && navigator.serviceWorker.controller)
          toast("نسخه‌ی جدید آماده است — برنامه را یک بار ببند و دوباره باز کن");
      });
    });
  }).catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => { window.__persisted = ok; });
})();
</script>
